# Let Dependabot's own pull requests merge themselves once CI is green.
#
# Dependabot cannot do this on its own: the `automerge:` key existed in the v1
# configuration format and was removed in v2, so it has to be a workflow.
#
# Two things outside this file make it work, and it does nothing without them:
#
#   * "Allow auto-merge" under Settings > General > Pull Requests.
#   * Required status checks on `main`. Those are what "once CI is green"
#     actually means. `--auto` only queues the merge behind whatever the branch
#     protection requires, so with no required checks it would merge instantly
#     and this file would be a way to skip review rather than automate it.
name: Dependabot auto-merge

on: pull_request

# Least privilege: enough to approve and queue a merge, nothing else. Note that
# workflows triggered by Dependabot get a read-only token unless the permissions
# are granted explicitly here.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Queue Dependabot updates
    runs-on: ubuntu-latest
    # Anyone can open a pull request. Only Dependabot's get this treatment.
    if: github.actor == 'dependabot[bot]'
    steps:
      # This action is the guard's own dependency, which makes it the one bump
      # in this repository worth reading rather than waving through: a change to
      # what it outputs changes what the condition below does, and nothing fails
      # while that happens.
      - name: Read what kind of update this is
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Queue the merge
        # Major bumps stay manual. An action's interface rarely changes, so the
        # checkout 4 -> 7 jump was harmless, but this repository also tracks
        # requests and Pillow, where a major version can change behaviour in
        # ways a passing test suite will not necessarily reveal. Those deserve a
        # look at the changelog rather than a green tick.
        #
        # Written as "is one of the safe kinds" rather than "is not major",
        # which matters more than it reads. `!= major` treats an empty or
        # unrecognised value as safe, so anything that leaves `update-type`
        # unpopulated turns this into an unconditional merge, majors included.
        # That was not hypothetical: fetch-metadata resolved `update-type` to
        # null for Python pull requests until v3.1.0 fixed it, and Python
        # dependencies are exactly what this repository tracks.
        #
        # Stated positively, an unknown value merges nothing. The failure is
        # then a bump sitting unmerged, which somebody notices, rather than one
        # merging itself, which nobody does.
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
