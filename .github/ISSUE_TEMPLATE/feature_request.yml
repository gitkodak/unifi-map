name: Feature request
description: Suggest something this should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        [`TODO.md`](https://github.com/gitkodak/unifi-map/blob/main/TODO.md)
        lists what is already planned, including an infrastructure view, an
        interactive HTML viewer and a `diff` between two snapshots. Worth a look
        first, though a nudge on something already listed is still useful signal.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think would solve it
