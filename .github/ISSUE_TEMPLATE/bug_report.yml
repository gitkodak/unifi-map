name: Bug report
description: Something does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste a raw snapshot from `cache/`, and check any output you
        attach. A snapshot is a MAC address, hostname and IP inventory of your
        network, and a rendered SVG carries hostnames, VLAN names and your WAN
        address as selectable text. Redact, or reproduce with the shipped demo
        dataset (`make demo`) if you can.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Console or controller
      placeholder: UDM Pro Max, Cloud Key Gen2, self-hosted controller
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: UniFi Network version
      description: Settings, then System, or the top of the web UI.
      placeholder: "10.5.67"
    validations:
      required: true

  - type: dropdown
    id: sites
    attributes:
      label: How many sites does this controller manage
      description: Multi-site setups are the least tested part of this tool.
      options:
        - One
        - More than one
        - Not sure
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
      placeholder: unifi-map render --theme dark --layout tree
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: >
        Run with `-v`, which logs every artwork lookup and every asset that
        came back empty. Redact addresses and hostnames.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have redacted anything about my network I do not want public
          required: true
        - label: I tried `make demo`, which uses synthetic data and no controller
        - label: I checked whether `--icons builtin --offline` behaves differently
