# A tag like `@v4` is mutable: whoever controls the action can repoint it, and
# CI runs whatever it points at today. The workflow pins commit SHAs instead,
# which means something has to advance them, which is this.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      # init and analyze in codeql.yml must run the same CodeQL Action
      # version -- a mismatch fails the job outright ("Loaded a configuration
      # file for version X, but running version Y"). Dependabot otherwise
      # treats each `uses:` subpath as an independent dependency and opens a
      # separate PR per one, which is exactly how that mismatch happened the
      # first time (PRs bumping init and analyze arrived separately).
      # upload-sarif is unaffected by the pairing but shares the same repo
      # and version stream, so it rides along rather than drifting.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"

  # requirements/ci.txt (KAN-191), the hashed lock CI installs from. Tracked
  # as a second entry rather than relying on the "/" entry above to discover a
  # requirements/ subdirectory on its own: pip-compile's header comment in the
  # file is what lets Dependabot re-run compilation on a bump rather than just
  # rewriting the pin, so this only works because `make lock` leaves it there.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"

  # .clusterfuzzlite/requirements.txt (KAN-194), the hashed lock for atheris.
  # Separate directory entry for the same reason as the one above.
  - package-ecosystem: pip
    directory: "/.clusterfuzzlite"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"

  # The fuzzing build's base image (KAN-194), pinned to a digest for the same
  # reason every GitHub Action here is pinned to a SHA. Not grouped with
  # anything: nothing else in this repo uses the docker ecosystem.
  - package-ecosystem: docker
    directory: "/.clusterfuzzlite"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
